name: Verify landscape
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: python -m unittest discover -s tests -p test_import.py
      - run: python scripts/import_data.py
      - run: git diff --exit-code public/data/landscape.json data/coverage.json
      - run: pnpm build
